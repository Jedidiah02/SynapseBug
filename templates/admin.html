<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body {
      background-image: url('https://plus.unsplash.com/premium_photo-1673002094407-a72547fa791a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTd8fGFkbWluaXN0cmF0aW9ufGVufDB8fDB8fHww');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #000000;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
      color: #333;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #ddd;
    }

    td form {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    button {
      width: 100px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      background: red;
      border: none;
      border-radius: 5px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.15);
      background: #e62222;
      position: relative;
    }

    button, button span {
      transition: 200ms;
    }

    button .text {
      transform: translateX(25px);
      color: white;
      font-weight: bold;
    }

    button .icon {
      position: absolute;
      border-left: 1px solid #c41b1b;
      transform: translateX(70px);
      height: 30px;
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button svg {
      width: 12px;
      fill: #eee;
    }

    button:hover {
      background: #ff3636;
    }

    button:hover .text {
      color: transparent;
    }

    button:hover .icon {
      width: 100px;
      border-left: none;
      transform: translateX(0);
    }

    button:focus {
      outline: none;
    }

    button:active .icon svg {
      transform: scale(0.8);
    }

    /* Ensure h1 is bold */
    h1 {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Username</th>
      <th>Email</th>
      <th>Action</th>
    </tr>
    {% for user in users %}
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>
        <form method="POST" action="/admin">
          <input type="hidden" name="delete_user_id" value="{{ user.id }}">
          <button type="submit">
            <span class="text">Delete</span>
            <span class="icon">
              <svg viewBox="0 0 20 20">
                <path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm4.29 11.29l-1.41 1.41L10 11.41l-2.88 2.88-1.41-1.41L8.59 10 5.71 7.12l1.41-1.41L10 8.59l2.88-2.88 1.41 1.41L11.41 10l2.88 2.88z"/>
              </svg>
            </span>
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
